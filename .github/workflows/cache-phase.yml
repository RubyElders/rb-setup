name: Cache phase
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      backend:
        required: true
        type: string
      phase:
        required: true
        type: string
      version:
        required: false
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./
        id: rb
        with:
          version: ${{ inputs.version }}
      - uses: ./tests/cache-action
        env:
          GH_TOKEN: ${{ github.token }}
          RB_SETUP_TEST_BINARY: ${{ steps.rb.outputs.rb-path }}
          RB_SETUP_TEST_BACKEND: ${{ inputs.backend }}
          RB_SETUP_CACHE_TEST_MODE: ${{ inputs.phase }}
          RB_SETUP_CACHE_TEST_SALT: ${{ github.run_id }}-${{ inputs.backend }}
