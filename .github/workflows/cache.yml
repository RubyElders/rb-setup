name: Cache development tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  build-rb:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: RubyElders/ruby-butler
          ref: 2d8de8d1037f8c3a56f1d4225aad4ad456f93e99
          path: rb-source
      - run: cargo build --release -p rb-cli
        working-directory: rb-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rb-${{ matrix.os }}
          path: rb-source/target/release/rb
          retention-days: 3
  cold:
    needs: build-rb
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: [bundler, native]
    uses: ./.github/workflows/cache-phase.yml
    with:
      os: ${{ matrix.os }}
      backend: ${{ matrix.backend }}
      phase: cold
  warm:
    needs: cold
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: [bundler, native]
    uses: ./.github/workflows/cache-phase.yml
    with:
      os: ${{ matrix.os }}
      backend: ${{ matrix.backend }}
      phase: warm
  uncached:
    needs: build-rb
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/cache-phase.yml
    with:
      os: ${{ matrix.os }}
      backend: native
      phase: uncached
